[project]
name = "payloq-schemas"
version = "0.1.0"
description = "PayLoq Pydantic schemas for scenario I/O"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payloq_schemas"]
