[project]
name = "payloq-benchmark"
version = "0.3.0"
description = "PayLoq benchmark harness — model matrix, graders, SQLite metrics"
requires-python = ">=3.12"
dependencies = [
  "payloq-schemas",
  "payloq-llm",
  "payloq-generator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payloq_benchmark"]
