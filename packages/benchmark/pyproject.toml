[project]
name = "payloq-benchmark"
version = "0.1.0"
description = "PayLoq benchmark harness scaffold (Phase 3 structure)"
requires-python = ">=3.12"
dependencies = [
  "payloq-schemas",
  "payloq-llm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payloq_benchmark"]
