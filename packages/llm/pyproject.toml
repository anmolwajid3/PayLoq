[project]
name = "payloq-llm"
version = "0.1.0"
description = "PayLoq LLM adapters (stubs + optional Ollama)"
requires-python = ">=3.12"
dependencies = [
  "payloq-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payloq_llm"]
