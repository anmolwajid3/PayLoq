[project]
name = "payloq-generator"
version = "0.1.0"
description = "PayLoq deterministic synthetic financial dataset generator"
requires-python = ">=3.12"
dependencies = [
  "payloq-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payloq_generator"]
