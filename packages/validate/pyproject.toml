[project]
name = "payloq-validate"
version = "0.1.0"
description = "PayLoq consistency validators for generated packs"
requires-python = ">=3.12"
dependencies = [
  "payloq-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payloq_validate"]
