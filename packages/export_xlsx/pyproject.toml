[project]
name = "payloq-export-xlsx"
version = "0.1.0"
description = "PayLoq Excel exporters (openpyxl)"
requires-python = ">=3.12"
dependencies = [
  "payloq-schemas",
  "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payloq_export_xlsx"]
