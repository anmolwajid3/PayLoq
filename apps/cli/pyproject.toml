[project]
name = "payloq-cli"
version = "0.1.0"
description = "PayLoq CLI — generate | validate | bench"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "payloq-schemas",
  "payloq-generator",
  "payloq-validate",
  "payloq-export-xlsx",
  "payloq-llm",
  "payloq-benchmark",
]

[project.scripts]
payloq = "payloq_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payloq_cli"]
